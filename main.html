<script>
// ── THEME ──────────────────────────────────────────────────
let darkMode = localStorage.getItem('mta_theme') !== 'light';
function applyTheme(){
  document.body.classList.toggle('light', !darkMode);
  document.getElementById('themeBtn').textContent = darkMode ? '🌙' : '☀️';
  localStorage.setItem('mta_theme', darkMode ? 'dark' : 'light');
}
applyTheme();
function toggleTheme(){ darkMode = !darkMode; applyTheme(); }

// ── QUESTION SHUFFLE ───────────────────────────────────────
// Per question, shuffle options once per session and cache mapping
// shuffleMap[qIndex] = { order: [shuffled indices], ansIdx: new answer index }
const shuffleMap = {};

function getShuffled(qIndex) {
  if (shuffleMap[qIndex]) return shuffleMap[qIndex];
  const q = QUESTIONS[qIndex];
  const order = q.opts.map((_, i) => i);
  // Fisher-Yates shuffle
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  // Find new position of correct answer
  const ansIdx = order.indexOf(q.ans);
  shuffleMap[qIndex] = { order, ansIdx };
  return shuffleMap[qIndex];
}

// ── SET LABELS ─────────────────────────────────────────────
const SET_LABELS = [
  "Network Models & OSI","Protocols & Addressing","Network Devices",
  "Wireless & Cabling","IP Addressing & Subnetting","Network Security & Services",
  "TCP/IP & Routing","DNS, DHCP & Name Resolution","Commands & Troubleshooting",
  "Wireless, VPNs & Advanced","Network Types & Protocols","DNS Records & Addressing",
  "Subnetting & Advanced IP","Network Fundamentals Review","Protocols, Ports & Security",
  "Commands & Troubleshooting","Mixed Review","Final Review Mix",
  "DHCP, VLANs & Advanced","Final Challenge"
];

// ── STATE ──────────────────────────────────────────────────
const BATCH_SIZE = 10;
const TOTAL_BATCHES = Math.ceil(QUESTIONS.length / BATCH_SIZE);

// Persist state in sessionStorage so it survives reload within same session
let state;
function loadState() {
  try {
    const saved = sessionStorage.getItem('mta_quiz_state');
    if (saved) {
      state = JSON.parse(saved);
      // Re-hydrate shuffleMap
      if (state.shuffleMap) {
        Object.assign(shuffleMap, state.shuffleMap);
      }
      return;
    }
  } catch(e) {}
  state = { batch:0, answers:{}, batchScores:{}, screen:'start', currentQ:0, batchAnswered:{} };
}
function saveState() {
  try {
    const toSave = {...state, shuffleMap};
    sessionStorage.setItem('mta_quiz_state', JSON.stringify(toSave));
  } catch(e) {}
}

loadState();

// ── WRONG REASON GENERATOR ─────────────────────────────────

    'ARP': 'ARP resolves IP addresses to MAC addresses — not names to IPs.',
    'NAT': 'NAT translates private IPs to public IPs. It doesn\'t assign addresses automatically.',
    'Star': 'Star topology uses a central hub/switch — each device gets its own cable, so it\'s not a single cable.',

    'WEP': 'WEP is the LEAST secure wireless authentication — it\'s easily cracked using freely available tools.',

    'IMAP': 'IMAP is an email retrieval protocol, not an address resolution protocol.',
    'RIP': 'RIP (Routing Information Protocol) is a routing protocol, not an address resolution protocol.',
    'UDP': 'UDP is a Transport layer protocol for sending datagrams, not for address resolution.',
    'Cat 3': 'Cat 3 only supports up to 10 Mbps — far below the 300 Mbps requirement.',
    'CAT5': 'CAT5 supports up to 100 Mbps — not enough for 300 Mbps.',
    'Cat 6': 'Cat 6 meets the requirement but is more expensive than Cat 5e, which also supports up to 1 Gbps.',
    'UTP Cat 5e': 'UTP Cat 5e supports up to 1 Gbps, but UTP has no shielding. The question involves interference, so STP is better.',
    'UTP Cat 6': 'Cat 6 UTP also lacks shielding against interference, and is more expensive than STP Cat 5e.',
    'Multimode fiber': 'Multimode fiber is used for shorter distances (up to ~2 km). Single mode goes tens of kilometers.',

    'Firewall': 'A Firewall filters traffic — it doesn\'t separate private from public by hosting resources.',

    'Data Link': 'Data Link layer (Layer 2) handles MAC addressing and framing. Routing happens at Layer 3.',
    'Physical': 'Physical layer (Layer 1) handles raw bits and signals. Routing is a Layer 3 (Network) function.',
    'Application': 'Application layer (Layer 7) interfaces with software. Routing is at Layer 3 (Network).',
    'HTTPS': 'HTTPS is an application-layer protocol. The question asks about the transport layer.',
    'FTP': 'FTP is an Application layer protocol — it runs above TCP/IP, not at the Transport layer.',
    'HTTP': 'HTTP is an Application layer protocol, not Transport layer.',
    'IP': 'IP is a Network layer (Layer 3) protocol — not Transport layer.',

    'TTL (Time to Live)': 'This is actually the correct answer — TTL controls how long DNS records are cached.',
    'SOA': 'SOA specifies the primary DNS server for a zone, not the cache duration.',
    'NS': 'NS records point to name servers for a domain — not cache duration.',
    'SNMP': 'SNMP (Simple Network Management Protocol) is for monitoring devices, not encrypting traffic.',
    'TFTP': 'TFTP (Trivial FTP) transfers files over UDP — it provides no encryption.',
    'MX record': 'MX records map to mail servers — not for resolving hostnames to IP addresses.',

    'Zone transfer': 'Zone transfer is actually the CORRECT answer here.',
    'Zone delegation': 'Zone delegation assigns authority for a subdomain — not the same as copying zone data.',
    '169.254.0.0 – 169.254.255.255': 'This is actually correct — APIPA uses the 169.254.0.0/16 range.',

  for (const [key, reason] of Object.entries(wrongMap)) {

  // Generic fallback
  return `"${chosenText || 'your answer'}" is incorrect. The key concept here: ${q.exp.split('—')[0].trim()}.`;

// ── RENDER ─────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'start') renderStart(app);
  else if (state.screen === 'quiz') renderQuiz(app);
  else if (state.screen === 'batch_result') renderBatchResult(app);
  else if (state.screen === 'final') renderFinal(app);
  saveState();
}

// ── QUIZ SCREEN ────────────────────────────────────────────
function renderQuiz(app) {
  const qs = getBatchQs(state.batch);
  const qIndex = state.batch * BATCH_SIZE + state.currentQ;
  const q = QUESTIONS[qIndex];
  const isAnswered = state.batchAnswered[qIndex] !== undefined;
  const chosenShuffled = state.answers[qIndex]; // index in shuffled order
  const overall = ((qIndex) / QUESTIONS.length * 100).toFixed(0);
  const setDone = Object.keys(state.batchAnswered).filter(k => Math.floor(k / BATCH_SIZE) === state.batch).length;

  const { order, ansIdx } = getShuffled(qIndex);

  let optsHtml = order.map((origIdx, si) => {
    const optText = q.opts[origIdx];
    const letter = String.fromCharCode(65 + si);
    let cls = 'opt';
    if (isAnswered) {
      if (si === ansIdx) cls = 'opt correct';
      else if (si === chosenShuffled && si !== ansIdx) cls = 'opt wrong';
    }
    return `<button class="${cls}" onclick="pickAnswer(${si})" ${isAnswered ? 'disabled' : ''}>
      <span class="opt-letter">${letter}</span>
      <span>${optText}</span>
    </button>`;
  }).join('');

  let fbHtml = '';
  if (isAnswered) {
    const ok = chosenShuffled === ansIdx;
    if (ok) {
      fbHtml = `<div class="feedback correct">
        <strong>✓ Correct!</strong>
        ${q.exp}
      </div>`;
    } else {
      const wrongReason = getWrongReason(q, chosenShuffled);
      const chosenOrigIdx = order[chosenShuffled];
      const chosenText = chosenShuffled !== undefined ? q.opts[chosenOrigIdx] : 'nothing';
      const correctText = q.opts[q.ans];
      fbHtml = `<div class="feedback wrong">
        <strong>✗ Not quite — here's why:</strong>
        <div class="wrong-reason">
          <b>Why your answer was wrong:</b>
          ${wrongReason}
        </div>
        <div class="wrong-reason" style="margin-top:.5rem">
          <b>Correct answer — ${String.fromCharCode(65 + ansIdx)}. ${correctText}</b>
          ${q.exp}
        </div>
      </div>`;
    }
  }

  app.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-row">
        <span>Q${qIndex + 1} of 200 &nbsp;·&nbsp; Set ${state.batch + 1}: ${SET_LABELS[state.batch]}</span>
        <span>${overall}%</span>
      </div>
      <div class="progress-bg"><div class="progress-fill" style="width:${overall}%"></div></div>
    </div>
    <div class="card">
      <div class="batch-header">Set ${state.batch + 1} of ${TOTAL_BATCHES} &nbsp;·&nbsp; Question ${state.currentQ + 1} of ${BATCH_SIZE}</div>
      <div class="q-num">Q${q.n}</div>
      <span class="q-tag" style="${getTagStyle(q.t)}">${q.t}</span>
      <div class="q-text">${q.q}</div>
      <div id="opts">${optsHtml}</div>
      ${fbHtml}
      ${isAnswered && state.currentQ < qs.length - 1 ? `<div style="margin-top:1rem"><button class="btn primary" onclick="nextQ()">Next question →</button></div>` : ''}
      ${isAnswered && state.currentQ === qs.length - 1 ? `<div style="margin-top:1rem"><button class="btn primary" onclick="showBatchResult()">View set results →</button></div>` : ''}
    </div>
    <div class="batch-nav">
      <button class="btn" onclick="goHome()">← All Sets</button>
      <span class="answered-count">${setDone}/${BATCH_SIZE} answered</span>
      <button class="btn restart-set" onclick="confirmRetryBatch()" title="Restart this set from question 1">↺ Restart Set</button>
    </div>`;
}

// ── BATCH RESULT SCREEN ────────────────────────────────────
function renderBatchResult(app) {
  const bs = state.batchScores[state.batch];
  const qs = getBatchQs(state.batch);
  const pct = Math.round(bs.score / bs.total * 100);
  const isLast = state.batch === TOTAL_BATCHES - 1;
  const ringColor = pct >= 80 ? '#4ade80' : pct >= 60 ? '#fbbf24' : '#f87171';
  const circumference = 2 * Math.PI * 54;
  const dashOffset = circumference * (1 - pct / 100);

  let reviewHtml = qs.map((q, i) => {
    const qIndex = state.batch * BATCH_SIZE + i;
    const chosenShuffled = state.answers[qIndex];
    const { order, ansIdx } = getShuffled(qIndex);
    const ok = chosenShuffled === ansIdx;
    const chosenOrigIdx = order[chosenShuffled];
    const chosenText = chosenShuffled !== undefined ? q.opts[chosenOrigIdx] : '(not answered)';
    const correctText = q.opts[q.ans];
    const wrongReason = !ok && chosenShuffled !== undefined ? getWrongReason(q, chosenShuffled) : '';

    return `<div class="review-item">

      <div class="review-exp">${q.exp}</div>

  }).join('');

  app.innerHTML = `
    <div class="card">
      <div style="text-align:center;padding:1.5rem 0 1rem">
        <div style="font-size:13px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1rem">Set ${state.batch + 1} · ${SET_LABELS[state.batch]}</div>

        </div>
        <div class="score-msg">${pct >= 80 ? '🎉 Excellent!' : pct >= 60 ? '👍 Good progress' : '📖 Review & retry'}</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          ${!isLast ? `<button class="btn primary" onclick="startBatch(${state.batch + 1})">Next Set (${state.batch + 2}) →</button>` : `<button class="btn primary" onclick="showFinal()">Final Results →</button>`}
          <button class="btn" onclick="retryBatch()">Retry Set</button>
          <button class="btn" onclick="goHome()">All Sets</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:700;color:var(--text-1);margin-bottom:.5rem">Review — Set ${state.batch + 1}</div>
      <div style="font-size:12px;color:var(--text-3);margin-bottom:1.25rem">Answer options below are shown in original order for review clarity.</div>
      ${reviewHtml}

}

// ── ACTIONS ────────────────────────────────────────────────
function startBatch(b) {
  state.batch = b; state.currentQ = 0; state.screen = 'quiz';
  render();
}

function pickAnswer(si) {
  const qIndex = state.batch * BATCH_SIZE + state.currentQ;
  if (state.batchAnswered[qIndex] !== undefined) return;
  state.answers[qIndex] = si;
  state.batchAnswered[qIndex] = true;
  render();
}

function nextQ() { state.currentQ++; render(); }

function showBatchResult() {
  const qs = getBatchQs(state.batch);
  let score = 0;
  qs.forEach((q, i) => {
    const qi = state.batch * BATCH_SIZE + i;
    const { ansIdx } = getShuffled(qi);
    if (state.answers[qi] === ansIdx) score++;
  });
  state.batchScores[state.batch] = { score, total: qs.length };
  state.screen = 'batch_result';
  render();
}

function retryBatch() {
  const qs = getBatchQs(state.batch);
  qs.forEach((_, i) => {
    const qi = state.batch * BATCH_SIZE + i;
    delete state.answers[qi];
    delete state.batchAnswered[qi];
    delete shuffleMap[qi]; // re-shuffle on retry
  });
  delete state.batchScores[state.batch];
  state.currentQ = 0; state.screen = 'quiz';
  render();
}

function showFinal() { state.screen = 'final'; render(); }
function goHome() { state.screen = 'start'; render(); }
function restartAll() {
  Object.keys(shuffleMap).forEach(k => delete shuffleMap[k]);
  state = { batch:0, answers:{}, batchScores:{}, screen:'start', currentQ:0, batchAnswered:{} };
  sessionStorage.removeItem('mta_quiz_state');
  render();
}

render();
</script>
</body>
